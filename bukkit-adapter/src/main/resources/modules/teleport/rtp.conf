# /rtp safe-search tuning. Mounted under modules.teleport.rtp.
command-opens-gui = true          # bare /rtp opens the world-picker GUI; set false to random-teleport in place instead
min-radius = 100                  # inner ring candidates must clear
max-radius = 5000                 # outer search radius
respect-claims = true             # never drop a player inside a land claim (any supported claim plugin)
respect-worldguard = true         # never drop a player inside a WorldGuard region
queue-target-size = 10            # pre-validated locations kept ready per world
queue-low-water = 5               # refill fires when the queue drops below this
# Per-search budget: a single /rtp safe-search never exceeds any of these; whichever is hit first ends it.
max-attempts = 40                 # candidate columns one search probes before giving up
max-chunk-loads = 30              # chunk loads one search may trigger before giving up
max-wall-clock-ms = 2500          # wall-clock ceiling for one search in milliseconds
excluded-biomes = ["ocean", "deep_ocean", "river"]
avoid-blocks = ["lava", "magma_block", "fire", "cactus"]
# Biome-targeted RTP: /rtp biome <biome> lands the player in a named biome. A passive registry learns where rare
# biomes are (recording each chunk's biome once as the world is explored) and biases the search toward those
# hotspots so rare biomes are feasible without hammering the whole radius.
biome-targeting = true            # learn rare-biome hotspots (ChunkLoadEvent) and bias /rtp biome toward them
biome-hotspot-registry-size = 30  # most hotspot chunks remembered per biome (the registry is bounded)
biome-hotspot-weight = 0.7        # share of biome-targeted samples drawn near a known hotspot (0.0 to 1.0)
# Persisted pool: the validated queue is mirrored to the database so it survives a restart and the first
# /rtp per world serves instantly instead of triggering a cold search storm.
persist-pool = true               # write validated locations to disk and pre-warm the queue from disk on enable
pool-max-per-world = 200          # most validated columns kept on disk per world; the oldest are evicted past this
pool-stale-after-hours = 72       # a validated column older than this is swept on enable rather than re-probed
pool-prewarm-requires-players = false  # when true, a world with nobody online is skipped by the startup pre-warm
# Arrival grace: after an /rtp lands, shield the player while the far terrain streams in so they do not die
# before it renders. Applied only on a successful random-teleport arrival.
grace-seconds = 5                 # length of the shield window in seconds (0 disables the grace)
grace-resistance = true           # apply Resistance for the window
grace-slow-falling = true         # apply Slow-Falling for the window
grace-block-fall-damage = true    # cancel fall damage outright for the window
# Cost: charged in the default currency. Checked before the search (a player who cannot pay never searches)
# and withdrawn only after a successful landing; a failed or refused /rtp never bills the player. 0 = free.
cost = 0
# Respawn / first-join RTP: served from the pre-warmed pool with no warmup, cooldown, or charge.
rtp-on-respawn = []               # world names whose players are random-teleported on death respawn
rtp-on-first-join = false         # random-teleport a brand-new player on their first join
# min-y = 0                       # uncomment to clamp the landing Y range (default: full world height)
# max-y = 256
