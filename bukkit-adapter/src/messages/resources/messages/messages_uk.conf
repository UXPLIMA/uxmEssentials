# Ukrainian message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>у тебе немає дозволу.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>цю команду може виконати лише гравець.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>гравця на ім'я</body> <value>{player}</value> <body>не знайдено.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>завантажений світ із назвою</body> <value>{world}</value> <body>не знайдено.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>координати та поворот мають бути скінченними числами.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>під час виконання команди щось пішло не так. спробуй ще раз за мить.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>зачекай</body> <level>{seconds}s</level><body>, перш ніж повторити.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>не рухайся, телепорт через</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>телепорт скасовано, ти зрушив з місця.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>твоя мова:</body> <value>{locale}</value><body>. доступні:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>мову змінено на</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>мову повернуто до тієї, що в твоєму клієнті.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>невідома мова</body> <value>{code}</value><body>. доступні:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>доступні мови:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'ДОВІДКА'> <muted>(сторінка <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>натисни, щоб набрати /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>натисни, щоб набрати /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>тобі не доступна жодна команда.</body>"
"help.no-match" = "<tag:'HELP'> <body>жодна команда не збігається з</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} сторінка <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← попередня сторінка</accent>"
"help.footer-next" = "<accent>→ наступна сторінка</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> інший плагін заблокував цю дію."

