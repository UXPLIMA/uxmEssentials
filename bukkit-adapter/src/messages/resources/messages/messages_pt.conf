# Brazilian Portuguese message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>voce nao tem permissao.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>este comando e somente para jogadores.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>nenhum jogador chamado</body> <value>{player}</value> <body>foi encontrado.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>nenhum mundo carregado chamado</body> <value>{world}</value> <body>foi encontrado.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>as coordenadas e a rotação devem ser números finitos.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>algo deu errado ao executar esse comando. tente novamente em instantes.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>espere</body> <level>{seconds}s</level> <body>antes de usar isso de novo.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>nao se mova, teletransportando em</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>teletransporte cancelado, voce se moveu.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>seu idioma e</body> <value>{locale}</value><body>. disponiveis:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>idioma definido como</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>idioma redefinido para o padrao do seu cliente.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>idioma desconhecido</body> <value>{code}</value><body>. disponiveis:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>idiomas disponiveis:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'AJUDA'> <muted>(pagina <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clique para digitar /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clique para digitar /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>voce nao tem comandos disponiveis.</body>"
"help.no-match" = "<tag:'HELP'> <body>nenhum comando corresponde a</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} pagina <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← pagina anterior</accent>"
"help.footer-next" = "<accent>→ proxima pagina</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> outro plugin bloqueou essa acao."

