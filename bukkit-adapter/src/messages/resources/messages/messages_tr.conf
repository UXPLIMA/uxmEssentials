# Turkish message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>bu işlem için yetkin yok.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>bu komut sadece oyuncular içindir.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>şu isimde</body> <value>{player}</value> <body>adlı bir oyuncu bulunamadı.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>şu adda yüklü bir dünya bulunamadı:</body> <value>{world}</value><body>.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>koordinatlar ve dönüş sonlu sayılar olmalıdır.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>bu komutu çalıştırırken bir şeyler ters gitti. birazdan tekrar dene.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>bunu tekrar kullanmadan önce</body> <level>{seconds}s</level> <body>bekle.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>kıpırdama,</body> <level>{seconds}s</level><body> içinde ışınlanıyorsun.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>ışınlanma iptal edildi, kıpırdadın.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>dilin</body> <value>{locale}</value><body>. kullanılabilir diller:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>dil</body> <value>{locale}</value><body> olarak ayarlandı.</body>"
"lang.reset" = "<tag:'LANG'> <body>dil, istemci varsayılanına sıfırlandı.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>bilinmeyen dil</body> <value>{code}</value><body>. kullanılabilir diller:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>kullanılabilir diller:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'HELP'> <muted>(sayfa <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>/{command} yazmak için tıkla</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>/{command} yazmak için tıkla</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>kullanabileceğin bir komut yok.</body>"
"help.no-match" = "<tag:'HELP'> <body>şununla eşleşen komut yok:</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} sayfa <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← önceki sayfa</accent>"
"help.footer-next" = "<accent>→ sonraki sayfa</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> başka bir eklenti bu işlemi engelledi."

