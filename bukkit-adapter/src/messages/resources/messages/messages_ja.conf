# Command Control: the deny line shown when a command is blocked by the whitelist/blacklist. unknown-command mimics
# vanilla's message (no plugin prefix) so a hidden command reads as though it does not exist; no-permission is the
# honest, prefixed alternative. The use-unknown-command-message config switch chooses between them.
"commandcontrol.unknown-command" = "<bad>知らないコマンドです。一覧は <plain>/help</plain> で見られます。</bad>"
"commandcontrol.no-permission" = "<etag:'ERROR'> <bad>そのコマンドを使う権限がありません。</bad>"
# plugin-hidden is the deny for the plugin-hide feature: a /plugins or /help blocked from executing for a player who
# may not see the plugin list. It reads like vanilla so the command looks as though it does not exist.
"commandcontrol.plugin-hidden" = "<bad>知らないコマンドです。一覧は <plain>/help</plain> で見られます。</bad>"
# command-spam lines. spam-kick is the disconnect reason for the KICK action; spam-blocked is the in-chat notice when a
# BLOCK action cancels the flooding command; spam-warn is the softer nudge for the WARN action, which lets the command run.
"commandcontrol.spam-kick" = "<bad>コマンドを送るのが速すぎます。</bad>"
"commandcontrol.spam-blocked" = "<etag:'ERROR'> <bad>コマンドを送るのが速すぎます。少しゆっくりどうぞ。</bad>"
"commandcontrol.spam-warn" = "<etag:'ERROR'> <bad>コマンドをたくさん送っています。少しゆっくりどうぞ。</bad>"

