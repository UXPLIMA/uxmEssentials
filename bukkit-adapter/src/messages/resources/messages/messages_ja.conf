# Japanese message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>権限がありません。</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>このコマンドはプレイヤー専用です。</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>名前が</body> <value>{player}</value> <body>のプレイヤーは見つかりませんでした。</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>名前が</body> <value>{world}</value> <body>の読み込み済みワールドは見つかりませんでした。</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>座標と回転には有限の数値を指定してください。</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>コマンドの実行中に問題が起きました。少ししてからもう一度お試しください。</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>もう一度使うまであと</body> <level>{seconds}s</level> <body>待ってください。</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>動かないでください。</body> <level>{seconds}s</level> <body>後にテレポートします。</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>動いたのでテレポートを中止しました。</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>あなたの言語は</body> <value>{locale}</value><body>です。使えるもの：</body> <body>{available}</body>。"
"lang.set" = "<tag:'LANG'> <body>言語を</body> <value>{locale}</value> <body>にしました。</body>"
"lang.reset" = "<tag:'LANG'> <body>言語をクライアントの設定に戻しました。</body>"
"lang.unknown" = "<etag:'ERROR'> <body>知らない言語</body> <value>{code}</value><body>です。使えるもの：</body> <body>{available}</body>。"
"lang.available" = "<tag:'LANG'> <body>使える言語：</body> <body>{available}</body>。"

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'ヘルプ'> <muted>（<level>{page}</level>/<level>{pages}</level> ページ）</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>クリックで /{command} を入力</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>クリックで /{command} を入力</muted>'><value>/{command}</value></hover></click> <muted>（<body>{aliases}</body>）</muted>"
"help.empty" = "<tag:'HELP'> <body>使えるコマンドがありません。</body>"
"help.no-match" = "<tag:'HELP'> <body>該当するコマンドがありません：</body> <value>{query}</value><body>。</body>"
"help.footer" = "<muted>{prev} <level>{page}</level>/<level>{pages}</level> ページ {next}</muted>"
"help.footer-prev" = "<accent>← 前のページ</accent>"
"help.footer-next" = "<accent>→ 次のページ</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> 別のプラグインがその操作を止めました。"

