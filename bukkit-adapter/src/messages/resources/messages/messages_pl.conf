# Polish message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>nie masz uprawnień.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>ta komenda działa tylko dla graczy.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>nie znaleziono gracza o nazwie</body> <value>{player}</value> <body>.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>nie znaleziono załadowanego świata o nazwie</body> <value>{world}</value><body>.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>współrzędne i obrót muszą być skończonymi liczbami.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>coś poszło nie tak podczas wykonywania tej komendy. spróbuj ponownie za chwilę.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>poczekaj</body> <level>{seconds}s</level> <body>zanim użyjesz tego ponownie.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>nie ruszaj się, teleportacja za</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>teleportacja anulowana, poruszyłeś się.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>twój język to</body> <value>{locale}</value><body>. dostępne:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>język ustawiony na</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>język zresetowany do domyślnego ustawienia klienta.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>nieznany język</body> <value>{code}</value><body>. dostępne:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>dostępne języki:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'POMOC'> <muted>(strona <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>kliknij, aby wpisać /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>kliknij, aby wpisać /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>nie masz dostępnych komend.</body>"
"help.no-match" = "<tag:'HELP'> <body>żadna komenda nie pasuje do</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} strona <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← poprzednia strona</accent>"
"help.footer-next" = "<accent>→ następna strona</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> inny plugin zablokował tę akcję."

