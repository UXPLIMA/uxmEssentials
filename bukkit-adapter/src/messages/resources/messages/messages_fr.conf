# French message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>tu n'as pas la permission.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>cette commande est réservée aux joueurs.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>aucun joueur nommé</body> <value>{player}</value> <body>n'a été trouvé.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>aucun monde chargé nommé</body> <value>{world}</value> <body>n'a été trouvé.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>les coordonnées et la rotation doivent être des nombres finis.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>une erreur est survenue en exécutant cette commande. réessaie dans un instant.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>attends</body> <level>{seconds}s</level> <body>avant de réutiliser ça.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>ne bouge pas, téléportation dans</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>téléportation annulée, tu as bougé.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>ta langue est</body> <value>{locale}</value><body>. disponibles:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>langue définie sur</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>langue réinitialisée à celle de ton client.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>langue inconnue</body> <value>{code}</value><body>. disponibles:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>langues disponibles:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'AIDE'> <muted>(page <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clique pour taper /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clique pour taper /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>tu n'as aucune commande disponible.</body>"
"help.no-match" = "<tag:'HELP'> <body>aucune commande ne correspond à</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} page <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← page précédente</accent>"
"help.footer-next" = "<accent>→ page suivante</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> un autre plugin a bloqué cette action."

