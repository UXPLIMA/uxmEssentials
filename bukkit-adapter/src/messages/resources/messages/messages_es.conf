# Spanish message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>no tienes permiso.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>este comando es solo para jugadores.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>no se encontró ningún jugador llamado</body> <value>{player}</value><body>.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>no se encontró ningún mundo cargado llamado</body> <value>{world}</value><body>.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>las coordenadas y la rotación deben ser números finitos.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>algo salió mal al ejecutar ese comando. intenta de nuevo en un momento.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>espera</body> <level>{seconds}s</level> <body>antes de volver a usar eso.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>no te muevas, teletransporte en</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>teletransporte cancelado, te moviste.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>tu idioma es</body> <value>{locale}</value><body>. disponibles:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>idioma establecido en</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>idioma restablecido al predeterminado de tu cliente.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>idioma desconocido</body> <value>{code}</value><body>. disponibles:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>idiomas disponibles:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'AYUDA'> <muted>(página <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clic para escribir /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>clic para escribir /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>no tienes comandos disponibles.</body>"
"help.no-match" = "<tag:'HELP'> <body>ningún comando coincide con</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} página <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← página anterior</accent>"
"help.footer-next" = "<accent>→ página siguiente</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> otro plugin bloqueó esa acción."

