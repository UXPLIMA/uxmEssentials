# Russian message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>у тебя нет прав на это.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>эта команда только для игроков.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>игрок с именем</body> <value>{player}</value> <body>не найден.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>загруженный мир с именем</body> <value>{world}</value> <body>не найден.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>координаты и поворот должны быть конечными числами.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>при выполнении команды что-то пошло не так. попробуй ещё раз через момент.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>подожди</body> <level>{seconds}s</level> <body>перед повторным использованием.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>не двигайся, телепортация через</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>телепортация отменена, ты сдвинулся.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>твой язык:</body> <value>{locale}</value><body>. доступны:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>язык установлен:</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>язык сброшен на язык твоего клиента.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>неизвестный язык</body> <value>{code}</value><body>. доступны:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>доступные языки:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'ПОМОЩЬ'> <muted>(страница <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>нажми, чтобы ввести /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>нажми, чтобы ввести /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>у тебя нет доступных команд.</body>"
"help.no-match" = "<tag:'HELP'> <body>нет команд, подходящих под</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} страница <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← предыдущая страница</accent>"
"help.footer-next" = "<accent>→ следующая страница</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> это действие заблокировал другой плагин."

