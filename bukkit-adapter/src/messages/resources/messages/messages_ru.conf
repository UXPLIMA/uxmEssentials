# account cap.
"security.alts.header" = "<tag:'Guard'> <body>аккаунты с тем же ip, что и у</body> <value>{player}</value> <body>(</body><level>{count}</level><body>):</body>"
"security.alts.entry" = " <muted>-</muted> <value>{alt}</value>"
"security.alts.none" = "<tag:'Guard'> <body>ни один другой аккаунт не имеет того же ip, что и</body> <value>{player}</value><body>.</body>"
"security.alts.notify" = "<tag:'Guard'> <value>{player}</value> <body>имеет тот же ip, что и</body> <level>{count}</level> <body>аккаунт(ов):</body> <value>{alts}</value>"
"security.alts.kicked" = "<bad>с твоего адреса подключается слишком много аккаунтов.</bad>"

# ClientID (Phase 4). {brand} is the reported client brand; client.blocked is a kick screen (no prefix), shown when
# a client is denied by the brand list.
"security.client.info" = "<tag:'Guard'> <value>{player}</value> <body>использует клиент</body> <value>{brand}</value><body>.</body>"
"security.client.unknown" = "<tag:'Guard'> <body>марка клиента не записана для</body> <value>{player}</value><body>.</body>"
"security.client.flagged" = "<tag:'Guard'> <value>{player}</value> <body>зашел с клиентом</body> <value>{brand}</value><body>.</body>"
"security.client.blocked" = "<bad>твой клиент не разрешен на этом сервере.</bad>"

# Command Control: the deny line shown when a command is blocked by the whitelist/blacklist. unknown-command mimics
# vanilla's message (no plugin prefix) so a hidden command reads as though it does not exist; no-permission is the
# honest, prefixed alternative. The use-unknown-command-message config switch chooses between them.
"commandcontrol.unknown-command" = "<bad>неизвестная команда. введи <plain>/help</plain> для списка команд.</bad>"
"commandcontrol.no-permission" = "<etag:'ERROR'> <bad>у тебя нет прав на использование этой команды.</bad>"
# plugin-hidden is the deny for the plugin-hide feature: a /plugins or /help blocked from executing for a player who
# may not see the plugin list. It reads like vanilla so the command looks as though it does not exist.
"commandcontrol.plugin-hidden" = "<bad>неизвестная команда. введи <plain>/help</plain> для списка команд.</bad>"
# command-spam lines. spam-kick is the disconnect reason for the KICK action; spam-blocked is the in-chat notice when a
# BLOCK action cancels the flooding command; spam-warn is the softer nudge for the WARN action, which lets the command run.
"commandcontrol.spam-kick" = "<bad>ты отправляешь команды слишком быстро.</bad>"
"commandcontrol.spam-blocked" = "<etag:'ERROR'> <bad>ты отправляешь команды слишком быстро. сбавь темп.</bad>"
"commandcontrol.spam-warn" = "<etag:'ERROR'> <bad>ты отправляешь слишком много команд. пожалуйста, сбавь темп.</bad>"

