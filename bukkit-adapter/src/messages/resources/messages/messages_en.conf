# English message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. English is drawn in small capitals, which are applied when the
# catalog is loaded, so the text below stays ordinary readable letters. A translation sets this to false unless
# its language really does have small-capital letters for every character it uses.
"meta.small-caps" = "true"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>you don't have permission.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>this command is player-only.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>no player named</body> <value>{player}</value> <body>was found.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>no loaded world named</body> <value>{world}</value> <body>was found.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>coordinates and rotation must be finite numbers.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>something went wrong running that command. please try again in a moment.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>wait</body> <level>{seconds}s</level> <body>before using that again.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>don't move, teleporting in</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>teleport cancelled, you moved.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>your language is</body> <value>{locale}</value><body>. available:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>language set to</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>language reset to your client default.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>unknown language</body> <value>{code}</value><body>. available:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>available languages:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'HELP'> <muted>(page <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>click to type /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>click to type /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>you have no commands available.</body>"
"help.no-match" = "<tag:'HELP'> <body>no commands match</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} page <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← previous page</accent>"
"help.footer-next" = "<accent>→ next page</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> another plugin blocked that action."

