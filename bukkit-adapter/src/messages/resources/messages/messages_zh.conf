# Simplified Chinese message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>你没有权限。</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>这条命令只能由玩家使用。</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>找不到名为</body> <value>{player}</value> <body>的玩家。</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>找不到名为</body> <value>{world}</value> <body>的已加载世界。</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>坐标和旋转必须是有限数值。</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>执行这条命令时出了问题，请稍后再试。</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>再次使用前请等待</body> <level>{seconds}s</level><body>。</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>请别动，</body><level>{seconds}s</level> <body>后传送。</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>你移动了，传送已取消。</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>你的语言是</body> <value>{locale}</value><body>。可选：</body> <body>{available}</body>。"
"lang.set" = "<tag:'LANG'> <body>语言已设为</body> <value>{locale}</value><body>。</body>"
"lang.reset" = "<tag:'LANG'> <body>语言已改回你客户端的默认设置。</body>"
"lang.unknown" = "<etag:'ERROR'> <body>没有这种语言</body> <value>{code}</value><body>。可选：</body> <body>{available}</body>。"
"lang.available" = "<tag:'LANG'> <body>可选语言：</body> <body>{available}</body>。"

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'帮助'> <muted>(第 <level>{page}</level>/<level>{pages}</level> 页)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>点击输入 /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>点击输入 /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>你没有可用的命令。</body>"
"help.no-match" = "<tag:'HELP'> <body>没有命令匹配</body> <value>{query}</value><body>。</body>"
"help.footer" = "<muted>{prev} 第 <level>{page}</level>/<level>{pages}</level> 页 {next}</muted>"
"help.footer-prev" = "<accent>← 上一页</accent>"
"help.footer-next" = "<accent>→ 下一页</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> 另一个插件拦下了这个动作。"

