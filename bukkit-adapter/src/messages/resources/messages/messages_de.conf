# German message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>du hast keine berechtigung.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>dieser befehl ist nur für spieler.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>kein spieler namens</body> <value>{player}</value> <body>gefunden.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>keine geladene welt namens</body> <value>{world}</value> <body>gefunden.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>koordinaten und rotation müssen endliche zahlen sein.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>bei der ausführung dieses befehls ist etwas schiefgelaufen. bitte versuche es gleich noch einmal.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>warte</body> <level>{seconds}s</level> <body>bevor du das erneut benutzt.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>nicht bewegen, teleportation in</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>teleport abgebrochen, du hast dich bewegt.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>deine sprache ist</body> <value>{locale}</value><body>. verfügbar:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>sprache auf</body> <value>{locale}</value><body> gesetzt.</body>"
"lang.reset" = "<tag:'LANG'> <body>sprache auf deinen client-standard zurückgesetzt.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>unbekannte sprache</body> <value>{code}</value><body>. verfügbar:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>verfügbare sprachen:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'HILFE'> <muted>(seite <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>klicke, um /{command} einzugeben</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>klicke, um /{command} einzugeben</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>du hast keine verfügbaren befehle.</body>"
"help.no-match" = "<tag:'HELP'> <body>keine befehle passen zu</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} seite <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← vorherige seite</accent>"
"help.footer-next" = "<accent>→ nächste seite</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> ein anderes plugin hat diese aktion blockiert."

