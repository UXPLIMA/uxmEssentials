# Korean message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The typography this catalog is written in. Small capitals exist for the twenty-six Latin letters
# only, so a language that uses anything else keeps its own letters and sets this to false.
"meta.small-caps" = "false"

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>권한이 없습니다.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>이 명령은 플레이어만 쓸 수 있습니다.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>이름이</body> <value>{player}</value> <body>인 플레이어를 찾지 못했습니다.</body>"
"command.unknown-world" = "<etag:'ERROR'> <body>이름이</body> <value>{world}</value> <body>인 로드된 월드를 찾지 못했습니다.</body>"
"command.invalid-position" = "<etag:'ERROR'> <bad>좌표와 회전은 유한한 숫자여야 합니다.</bad>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>명령을 실행하다가 문제가 생겼습니다. 잠시 뒤에 다시 해 보세요.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>다시 쓰려면</body> <level>{seconds}s</level> <body>기다리세요.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>움직이지 마세요. 이동까지</body> <level>{seconds}s</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>움직여서 이동이 취소되었습니다.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>지금 언어는</body> <value>{locale}</value><body>입니다. 쓸 수 있는 언어:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>언어를</body> <value>{locale}</value><body>(으)로 바꿨습니다.</body>"
"lang.reset" = "<tag:'LANG'> <body>언어를 클라이언트 기본값으로 되돌렸습니다.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>모르는 언어</body> <value>{code}</value><body>입니다. 쓸 수 있는 언어:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>쓸 수 있는 언어:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'도움말'> <muted>(<level>{page}</level>/<level>{pages}</level> 쪽)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>누르면 /{command} 이(가) 입력됩니다</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>누르면 /{command} 이(가) 입력됩니다</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>쓸 수 있는 명령이 없습니다.</body>"
"help.no-match" = "<tag:'HELP'> <body>맞는 명령이 없습니다:</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} <level>{page}</level>/<level>{pages}</level> 쪽 {next}</muted>"
"help.footer-prev" = "<accent>← 이전 쪽</accent>"
"help.footer-next" = "<accent>→ 다음 쪽</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> 다른 플러그인이 그 동작을 막았습니다."

