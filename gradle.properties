# Build environment. Pin UTF-8 + en-US locale so Spotless / Palantir formatting
# and any locale-sensitive task behave identically on every machine and on CI
# regardless of the host's default charset or locale.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx2G

# Parallel + build caching for a snappier multi-module build.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is intentionally OFF: it does not correctly restore the
# Spotless formatter worker classloaders (Palantir/Guava + ktlint), which then
# fail with a NoClassDefFoundError (com.google.common.collect.Iterables$4 /
# ktlint AnnotationRule) on a cache hit. The build cache + parallel give most of
# the speed without that fragility.
org.gradle.configuration-cache=false
